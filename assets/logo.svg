<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f6ef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#logoGrad)" />
  <!-- Shine overlay -->
  <rect x="2" y="2" width="60" height="30" rx="14" fill="url(#logoShine)" />
  <!-- Droplet shape -->
  <path d="M32 16 C32 16 22 27 22 36 C22 43.5 26.5 48 32 48 C37.5 48 42 43.5 42 36 C42 27 32 16 32 16 Z" fill="#ffffff" opacity="0.95" />
  <!-- Small sparkle/star -->
  <path d="M38 22 L39.2 25.5 L42.5 26.7 L39.2 27.9 L38 31 L36.8 27.9 L33.5 26.7 L36.8 25.5 Z" fill="#ffffff" opacity="0.8" />
  <!-- Checkmark inside droplet -->
  <path d="M27 36 L31 40 L38 31" fill="none" stroke="#4f6ef7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
